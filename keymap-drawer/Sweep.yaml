layout: {zmk_keyboard: Sweep}
layers:
  Default Layer:
  - Q
  - W
  - E
  - R
  - T
  - Y
  - U
  - I
  - O
  - P
  - {t: A, h: '$$mdi:apple-keyboard-option$$'}
  - {t: S, h: '$$mdi:apple-keyboard-shift$$'}
  - {t: D, h: '$$mdi:apple-keyboard-control$$'}
  - {t: F, h: '$$mdi:apple-keyboard-command$$'}
  - G
  - H
  - {t: J, h: RGUI}
  - {t: K, h: '$$mdi:apple-keyboard-control$$'}
  - {t: L, h: '$$mdi:apple-keyboard-shift$$'}
  - {t: ;, h: '$$mdi:apple-keyboard-option$$', s: ':'}
  - Z
  - X
  - C
  - V
  - B
  - N
  - M
  - {t: ',', s: <}
  - {t: ., s: '>'}
  - {t: /, s: '?'}
  - {t: '$$mdi:keyboard-tab$$', h: Symbol}
  - $$mdi:keyboard-space$$
  - RETURN
  - {t: '$$mdi:backspace$$', h: lower_layer}
  lower_layer:
  - {t: '1', s: '!'}
  - {t: '2', s: '@'}
  - {t: '3', s: '#'}
  - {t: '4', s: $}
  - {t: '5', s: '%'}
  - {t: '6', s: ^}
  - {t: '7', s: '&'}
  - {t: '8', s: '*'}
  - {t: '9', s: (}
  - {t: '0', s: )}
  - F1
  - MUTE
  - $$mdi:volume-low$$
  - $$mdi:volume-high$$
  - PgUp
  - Sft+$$mdi:arrow-left-bold$$
  - $$mdi:arrow-up-bold$$
  - $$mdi:arrow-down-bold$$
  - $$mdi:arrow-right-bold$$
  - F10
  - F2
  - F3
  - F4
  - F5
  - PgDn
  - F6
  - F7
  - F8
  - F9
  - F11
  - {t: '$$mdi:transfer$$', type: trans}
  - {t: '$$mdi:transfer$$', type: trans}
  - {t: '$$mdi:transfer$$', type: trans}
  - {type: held}
  Symbol:
  - $$mdi:keyboard-esc$$
  - '"'
  - <
  - '>'
  - {t: '''', s: '"'}
  - _
  - (
  - )
  - '~'
  - \
  - {t: '!', h: '$$mdi:apple-keyboard-option$$'}
  - {t: '@', h: '$$mdi:apple-keyboard-shift$$'}
  - {t: '#', h: '$$mdi:apple-keyboard-control$$'}
  - {t: $, h: LGUI}
  - '%'
  - +
  - {t: '[', h: RGUI, s: '{'}
  - {t: ']', h: '$$mdi:apple-keyboard-control$$', s: '}'}
  - {t: '=', h: '$$mdi:apple-keyboard-shift$$', s: +}
  - {t: ':', h: '$$mdi:apple-keyboard-option$$'}
  - $$mdi:keyboard-tab$$
  - '|'
  - $$mdi:apple-keyboard-control$$
  - '&'
  - '*'
  - {t: '-', s: _}
  - '{'
  - '}'
  - {t: '`', s: '~'}
  - '?'
  - {type: held}
  - {t: '$$mdi:transfer$$', type: trans}
  - {t: '$$mdi:transfer$$', type: trans}
  - {t: '$$mdi:transfer$$', type: trans}
